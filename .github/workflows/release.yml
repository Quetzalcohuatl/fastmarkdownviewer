name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  desktop:
    uses: ./.github/workflows/experimental-desktop.yml

  windows-x86_64:
    runs-on: windows-2022
    steps:
      - name: Check out annotated tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $escapedTag = [regex]::Escape($env:GITHUB_REF_NAME)
          $peeledTag = git ls-remote --tags origin | Where-Object { $_ -match "refs/tags/$escapedTag\^\{\}$" }
          if (-not $peeledTag) {
            throw 'Releases require an annotated tag.'
          }
          $tagCommit = ($peeledTag -split '\s+')[0]
          $checkedOutCommit = git rev-parse HEAD
          if ($checkedOutCommit -ne $tagCommit) {
            throw "Checked-out commit $checkedOutCommit does not match tag commit $tagCommit."
          }
          $manifest = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($manifest.packages[0].version -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $($manifest.packages[0].version)."
          }
          $repositoryUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          if ($manifest.packages[0].repository -ne $repositoryUrl) {
            throw "Cargo.toml repository must be $repositoryUrl before release."
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install 1.95.0 --component clippy,rustfmt --target x86_64-pc-windows-msvc
          rustup default 1.95.0

      - name: Test locked source
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Build release once
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Smoke-test the exact release executable
        shell: pwsh
        run: .\scripts\test-windows-ui.ps1 -Binary .\target\x86_64-pc-windows-msvc\release\FastMarkdownViewer.exe -Fixture .\tests\fixtures\feature-matrix.md -Headless

      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Package exact release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $repositoryUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          .\scripts\package-release.ps1 -Version $version -Binary .\target\x86_64-pc-windows-msvc\release\FastMarkdownViewer.exe -OutputDirectory .\release -RepositoryUrl $repositoryUrl
          .\scripts\verify-release.ps1 -Version $version -Directory .\release

      - name: Install, exercise, and uninstall the packaged application
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\scripts\test-windows-installer.ps1 -Installer ".\release\FastMarkdownViewer-Setup-$version.exe" -Fixture .\tests\fixtures\feature-matrix.md -Headless

      - name: Retain verified Windows assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  publish:
    needs: [checks, desktop, windows-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name release-windows --dir release
          gh run download "$GITHUB_RUN_ID" --pattern 'desktop-*' --dir desktop
          find desktop -type f -exec cp {} release/ \;
          cd release
          sha256sum --check SHA256SUMS.txt
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(p for p in Path('.').iterdir() if p.suffix in {'.exe', '.zip', '.gz', '.deb'})
          assert len(files) == 7, [str(p) for p in files]
          Path('SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Attest all platform assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $releaseArguments = @(
            'release', 'create', $env:GITHUB_REF_NAME
          ) + (Get-ChildItem .\release -File | ForEach-Object FullName) + @(
            '--verify-tag', '--title', $env:GITHUB_REF_NAME,
            '--notes-file', '.github/RELEASE_NOTES.md', '--generate-notes'
          )
          if ($version.Contains('-')) {
            $releaseArguments += @('--prerelease', '--latest=false')
          } else {
            $releaseArguments += '--latest'
          }
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
