name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  distribution:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release distribution decisions
        run: python scripts/test-distribution.py
      - name: Lint release distribution workflow
        run: |
          Invoke-WebRequest https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip -OutFile actionlint.zip
          if ((Get-FileHash actionlint.zip -Algorithm SHA256).Hash -ne '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9') { throw 'actionlint checksum mismatch' }
          Expand-Archive actionlint.zip -DestinationPath actionlint
          ./actionlint/actionlint.exe .github/workflows/distribution.yml .github/workflows/ci.yml
          if ($LASTEXITCODE -ne 0) { throw 'Workflow validation failed.' }

  rust:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install 1.95.0 --component clippy,rustfmt --target x86_64-pc-windows-msvc
          rustup default 1.95.0

      - name: Verify formatting
        run: cargo fmt -p fast-markdown-viewer -p fmv-macos-events -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build native UI smoke target
        run: cargo build --locked --bin FastMarkdownViewer --example visual_check

      - name: Verify real OpenGL failure recovery and software-rendered frames
        run: .\scripts\test-windows-graphics.ps1

      - name: Retain Windows graphics evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-graphics
          path: target/windows-graphics/*
          if-no-files-found: warn

      - name: Smoke-test the exact Windows executable
        shell: pwsh
        run: |
          .\scripts\test-windows-ui.ps1 -Binary .\target\debug\FastMarkdownViewer.exe -Fixture .\tests\fixtures\feature-matrix.md
          .\scripts\test-windows-ui.ps1 -Binary .\target\debug\FastMarkdownViewer.exe -Fixture .\tests\fixtures\feature-matrix.md -Renderer software

      - name: Verify source packages and registry installation
        run: |
          cargo package --workspace --locked
          python scripts/test-cargo-registry.py

  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.95.0
          rustup default 1.95.0

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit RustSec advisories
        run: cargo audit --ignore RUSTSEC-2026-0192

      - name: Check licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  site:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate static site
        shell: bash
        run: |
          test -f docs/index.html
          test -f docs/styles.css
          ! grep -RniE '<script|google-analytics|googletagmanager' docs
          grep -q '{{REPOSITORY_URL}}' docs/index.html
          grep -q '{{REPOSITORY_SLUG}}' docs/index.html
