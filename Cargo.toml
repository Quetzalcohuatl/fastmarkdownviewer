[package]
name = "fast-markdown-viewer"
version = "0.2.7"
edition = "2024"
rust-version = "1.95"
description = "A fast, read-only Markdown viewer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Quetzalcohuatl/fastmarkdownviewer"
homepage = "https://Quetzalcohuatl.github.io/fastmarkdownviewer/"
readme = "README.md"
build = "build.rs"
keywords = ["markdown", "viewer", "desktop", "native"]
categories = ["visualization", "gui"]
include = ["/src/**", "/assets/**", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-*", "/THIRD_PARTY_NOTICES.md", "/docs/REGISTRY_DISTRIBUTION.md", "/tests/**", "/examples/**"]

# Install only official release binaries; unsupported targets must not silently
# fall back to a compiler that may be older than our source-build minimum.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/FastMarkdownViewer-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/FastMarkdownViewer-{ version }-windows-x86_64.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/FastMarkdownViewer-{ version }-linux-x86_64.tar.gz"
pkg-fmt = "tgz"
bin-dir = "FastMarkdownViewer-{ version }-linux-x86_64/{ bin }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/FastMarkdownViewer-{ version }-macos-aarch64.zip"
pkg-fmt = "zip"
bin-dir = "FastMarkdownViewer-{ version }-macos-aarch64/FastMarkdownViewer.app/Contents/MacOS/{ bin }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/FastMarkdownViewer-{ version }-macos-x86_64.zip"
pkg-fmt = "zip"
bin-dir = "FastMarkdownViewer-{ version }-macos-x86_64/FastMarkdownViewer.app/Contents/MacOS/{ bin }"

[workspace]
resolver = "3"
members = ["crates/macos-events", "vendor/egui_commonmark", "vendor/egui_commonmark_backend", "crates/mermaid-diagrams"]
default-members = ["."]

[features]
default = ["renderer-glow"]
renderer-glow = ["eframe/glow"]
renderer-wgpu = ["eframe/wgpu"]

[[bin]]
name = "FastMarkdownViewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.0", default-features = false, features = ["accesskit", "default_fonts"] }
# FMV registers its bounded loaders; commonmark's loader features are redundant.
egui_commonmark = { package = "fmv-egui-commonmark", version = "=0.25.0-fmv.1", path = "vendor/egui_commonmark", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
open = "5.3.2"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui_commonmark_backend = { package = "fmv-egui-commonmark-backend", version = "=0.25.0-fmv.1", path = "vendor/egui_commonmark_backend", default-features = false }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
rusty-mermaid-core = "=0.2.0"
rusty-mermaid-svg = "=0.2.0"
rusty-mermaid-diagrams = { package = "fmv-rusty-mermaid-diagrams", version = "=0.2.0-fmv.1", path = "crates/mermaid-diagrams" }
tempfile = "3.23.0"
rfd = { version = "0.15.4", default-features = false }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2.5.7"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.0", default-features = false, features = ["x11", "wayland"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Keep OpenGL as the fast path, with Direct3D/WARP for basic display drivers.
# Do not pull in unused Vulkan/Metal/GLES backends for this fallback.
eframe = { version = "0.36.0", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30.0", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = { version = "0.1.0", path = "crates/macos-events" }

[build-dependencies]
winresource = "0.1.23"

[dev-dependencies]
ttf-parser = "0.25.1"

[profile.release]
opt-level = 3
# Full LTO shrinks the executable without the reading cost of opt-level s/z.
# Measurements: experiments/size/compiler-profiles.md.
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
