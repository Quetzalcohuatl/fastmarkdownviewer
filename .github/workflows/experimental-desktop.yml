name: Desktop builds

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'feature/cross-platform']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record macOS font inventory
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/evidence
          python3 - <<'PY' > target/evidence/macos-fonts.txt
          from pathlib import Path
          roots = [Path('/Library/Fonts'), Path('/System/Library/Fonts')]
          roots += sorted(Path('/System/Library/AssetsV2').glob('com_apple_MobileAsset_Font*'))
          for root in roots:
              print(f'Font root: {root}')
              for font in sorted(root.rglob('*')):
                  if font.suffix.lower() in {'.ttc', '.ttf', '.otf', '.otc'}:
                      print(f'{font} (file={font.is_file()}, symlink={font.is_symlink()})')
          PY
      - name: Restore Rust build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: desktop-${{ matrix.platform }}-rust195-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            desktop-${{ matrix.platform }}-rust195-${{ hashFiles('Cargo.lock') }}-
            desktop-${{ matrix.platform }}-rust195-
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev xvfb fonts-dejavu-core fonts-noto-core fonts-noto-cjk weston openbox xdotool xclip scrot xdg-desktop-portal-gtk
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Check source
        run: |
          cargo fmt -p fast-markdown-viewer -p fmv-macos-events -- --check
          cargo clippy --locked --all-targets --no-deps -- -D warnings
          cargo test --locked --all-targets
      - name: Build optimized executable and capture tool
        run: cargo build --locked --release --bin FastMarkdownViewer --example visual_check
      - name: Cache compiled artifacts before native acceptance
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: desktop-${{ matrix.platform }}-rust195-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: Verify source packages and registry installation
        run: |
          cargo package --workspace --locked
          python3 scripts/test-cargo-registry.py
      - name: Exercise Linux graphics
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/evidence
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a target/release/examples/visual_check tests/fixtures/cross-platform.md target/evidence/linux.png
          FMV_VISUAL_THEME=Light LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a target/release/examples/visual_check tests/fixtures/multilingual-ui.md target/evidence/multilingual-light.png '中文'
          FMV_VISUAL_THEME=Dark LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a target/release/examples/visual_check tests/fixtures/multilingual-ui.md target/evidence/multilingual-dark.png '中文'
      - name: Exercise macOS graphics
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/evidence
          target/release/examples/visual_check tests/fixtures/cross-platform.md target/evidence/macos.png
          FMV_VISUAL_THEME=Light target/release/examples/visual_check tests/fixtures/multilingual-ui.md target/evidence/multilingual-light.png '中文'
          FMV_VISUAL_THEME=Dark target/release/examples/visual_check tests/fixtures/multilingual-ui.md target/evidence/multilingual-dark.png '中文'
      - name: Exercise native Wayland graphics
        if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          weston --backend=headless-backend.so --socket=fmv-test --idle-time=0 --width=1280 --height=900 > target/evidence/weston.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor"' EXIT
          for attempt in $(seq 1 50); do test ! -S "$XDG_RUNTIME_DIR/fmv-test" || break; sleep 0.1; done
          env -u DISPLAY WAYLAND_DISPLAY=fmv-test LIBGL_ALWAYS_SOFTWARE=1 target/release/examples/visual_check tests/fixtures/cross-platform.md target/evidence/wayland.png
      - name: Package desktop build
        run: python3 scripts/package-unix.py --platform '${{ matrix.platform }}' --binary target/release/FastMarkdownViewer
      - name: Install packaged binary with binstall and no Rust on PATH
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/test-binstall.py --platform '${{ matrix.platform }}' --packages dist
      - name: Exercise Finder opening and saved sessions in the extracted Mac app
        if: runner.os == 'macOS'
        run: python3 scripts/test-macos-package.py dist/*.zip
      - name: Smoke-test packaged executable
        shell: bash
        run: |
          binary=$(find dist -type f -name FastMarkdownViewer | head -n 1)
          "$binary" --version
          printf 'flowchart LR\n A[Open] --> B[Read]\n' > target/evidence/packaged.mmd
          "$binary" --internal-mermaid target/evidence/packaged.mmd target/evidence/packaged.png
          test -s target/evidence/packaged.png
      - name: Install and exercise Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          cmp target/release/FastMarkdownViewer /usr/bin/FastMarkdownViewer
          /usr/bin/FastMarkdownViewer --internal-mermaid target/evidence/packaged.mmd target/evidence/installed.png
          test -s target/evidence/installed.png
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash scripts/test-linux-session.sh
          sudo apt-get remove -y fast-markdown-viewer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.platform }}
          path: target/evidence/
          retention-days: 14
