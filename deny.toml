[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "Unmaintained-only bincode 1.3.3 dependency required by syntect 5.3 syntax/theme dumps. Only bundled trusted dumps are loaded; no user-supplied serialized data. No safe upgrade or vulnerability is listed." },
    { id = "RUSTSEC-2026-0192", reason = "Unmaintained-only ttf-parser warning inherited through RaTeX; no safe upgrade is available and no vulnerability is disclosed." },
    { id = "RUSTSEC-2026-0371", reason = "Unmaintained-only zbus_names warning inherited through Linux accessibility and portal dialogs. The crate moved into zbus 6; upstream accesskit/atspi and ashpd still require zbus 5. No vulnerability is disclosed. Review migration by 2027-01-28." },
    { id = "RUSTSEC-2026-0370", reason = "Unmaintained-only zvariant warning inherited through Linux accessibility and portal dialogs. The crate moved into zbus 6; upstream accesskit/atspi and ashpd still require zbus 5. No vulnerability is disclosed. Review migration by 2027-01-28." },
    { id = "RUSTSEC-2026-0372", reason = "Unmaintained-only zvariant_derive warning inherited through Linux accessibility and portal dialogs. Its macros moved into zbus 6; upstream accesskit/atspi and ashpd still require zbus 5. No vulnerability is disclosed. Review migration by 2027-01-28." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
