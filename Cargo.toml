[package]
name = "fast-markdown-viewer"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
description = "A fast, read-only Markdown viewer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Quetzalcohuatl/fastmarkdownviewer"
homepage = "https://Quetzalcohuatl.github.io/fastmarkdownviewer/"
readme = "README.md"
build = "build.rs"

[features]
default = ["renderer-glow"]
renderer-glow = ["eframe/glow"]
renderer-wgpu = ["eframe/wgpu"]

[[bin]]
name = "FastMarkdownViewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.0", default-features = false, features = ["accesskit", "default_fonts"] }
egui_extras = { version = "0.36.0", default-features = false, features = ["file", "image", "svg"] }
egui_commonmark = { version = "0.25.0", default-features = false, features = ["load-images", "pulldown_cmark", "svg"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
open = "5.3.2"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
resvg = { version = "0.45.1", default-features = false }
rfd = { version = "0.15.4", default-features = false }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2.5.7"

[build-dependencies]
winresource = "0.1.23"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[patch.crates-io]
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
